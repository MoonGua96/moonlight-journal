name: Build Windows installer

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run tauri build

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: Moonlight-Journal-v0.7.3-Windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Publish installer to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.7.3
          name: 月光簿 v0.7.3
          body: |
            Windows 公開版安裝檔。下載下方的 x64-setup.exe 後即可安裝，不需要另外安裝 Node.js 或 Rust。

            此版本尚未使用商業程式碼簽章，Windows 可能顯示「未知發行者」或 SmartScreen 提示。
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
